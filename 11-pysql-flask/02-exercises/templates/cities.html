<!doctype html>
<html lang="en">
<header>
        <meta charset="utf-8">
        <title>Cities</title>
</header>
<body>
<form action="/cities" method="get">
    <label for="country">
        Country code
    </label>
    <input id="country"
           name="country"
           value ="{{ code }}"
           maxlength="3" required>
    <button type="submit">Search</button>
</form>
<h1>Cities in {{ code }}</h1>
<ul>
    {% for name, district, population in rows %}
    <li>
        {{ name }}: {{ district }}, {{ population }}
    </li>
    {% else %}
    <li> No cities found.</li>
    {% endfor %}
    <li>Cities found: {{ count }}</li>
</ul>

<a href="/">Home </a></br>


</body>
</html>
